[package]
name = "dispatcher"
version = "0.1.0"
edition = "2021"

# The dispatcher itself lives in map-lambda, but build it here so that `cargo
# lambda watch` can serve it alongside this project's own worker functions.

[dependencies]
lambda_runtime = "1.0.1"
map-lambda-dispatcher = { git = "https://github.com/tomwhite/map-lambda", rev = "bb0893a" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
