[package]
name = "python"
version = "0.1.0"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
datafusion = "54.0.0"
fanout = { path = "../fanout" }
pyo3 = { version = "0.28", features = ["abi3-py312"] }
serde_json = "1"
split = { path = "../split" }
tokio = { version = "1", features = ["rt-multi-thread"] }
