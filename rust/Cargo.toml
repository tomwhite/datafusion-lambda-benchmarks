[workspace]
resolver = "2"
members = [
    "dispatcher",
    "fanout",
    "fragment",
    "python",
    "split",
]
# Only what `cargo lambda watch` serves, and what it shares: the extension is
# built by maturin.
default-members = [
    "dispatcher",
    "fragment",
    "split",
]

[profile.release]
strip = true
